<!DOCTYPE html>
<html lang="en" {{ROOT}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="{{COLOR_SCHEME}}">
<title>{{TITLE}} · mdpv</title>
<link rel="icon" href="{{ASSETS}}/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ASSETS}}/vendor/github-markdown.css">
<link rel="stylesheet" href="{{ASSETS}}/mdpv.css">
<link rel="stylesheet" href="{{ASSETS}}/obsidian.css">
<script type="application/json" id="mdpv-boot">{{BOOT}}</script>
<script defer src="{{ASSETS}}/vendor/markdown-it.min.js"></script>
<script defer src="{{ASSETS}}/vendor/markdown-it-task-lists.min.js"></script>
<script defer src="{{ASSETS}}/vendor/markdown-it-footnote.min.js"></script>
<script defer src="{{ASSETS}}/vendor/markdown-it-emoji.min.js"></script>
<script defer src="{{ASSETS}}/vendor/markdown-it-mark.min.js"></script>
<script defer src="{{ASSETS}}/vendor/purify.min.js"></script>
<script defer src="{{ASSETS}}/vendor/morphdom-umd.min.js"></script>
<script type="module" src="{{ASSETS}}/js/main.js"></script>
</head>
<body>
<main>
  <article id="content" class="markdown-body">
    <p class="mdpv-loading">Connecting to Neovim&hellip;</p>
  </article>
</main>

<nav id="mdpv-toc" aria-label="Document outline" hidden>
  <div id="outline-list"></div>
</nav>

<div id="mdpv-fab">
  <button type="button" id="fab-toggle" popovertarget="fab-menu" aria-label="mdpv menu">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M14.85 3H1.15C.52 3 0 3.52 0 4.15v7.69C0 12.48.52 13 1.15 13h13.69c.64 0 1.15-.52 1.15-1.15v-7.7C16 3.52 15.48 3 14.85 3ZM9 11H7V8L5.5 9.92 4 8v3H2V5h2l1.5 2L7 5h2v6Zm2.99.5L9.5 8H11V5h2v3h1.5l-2.51 3.5Z"/></svg>
    <span class="dot"></span>
  </button>
</div>

<div id="fab-menu" popover>
  <div class="menu-status"><span class="dot"></span><span id="status-text">live</span></div>
  <div class="menu-group" id="sync-group" hidden>
    <div class="menu-label">Sync</div>
    <button type="button" role="switch" data-pref="follow" title="Scroll the page along with the cursor in Neovim">Follow cursor<kbd>f</kbd><span class="switch"></span></button>
    <button type="button" role="switch" data-pref="syncback" title="Scrolling the page moves the cursor in Neovim">Move cursor on scroll<span class="switch"></span></button>
  </div>
  <div class="menu-group">
    <div class="menu-label">View</div>
    <button type="button" role="switch" data-pref="outline" title="Document outline">Outline<kbd>o</kbd><span class="switch"></span></button>
    <button type="button" role="switch" data-pref="wide" title="Let the page span the full window width">Full width<kbd>w</kbd><span class="switch"></span></button>
    <div class="menu-row">Theme<kbd>t</kbd>
      <div class="segmented" role="radiogroup" aria-label="Theme" data-pref="theme">
        <button type="button" role="radio" data-value="auto">Auto</button>
        <button type="button" role="radio" data-value="light">Light</button>
        <button type="button" role="radio" data-value="dark">Dark</button>
      </div>
    </div>
    <div class="menu-row">Style<kbd>s</kbd>
      <div class="segmented" role="radiogroup" aria-label="Style" data-pref="style">
        <button type="button" role="radio" data-value="github">GitHub</button>
        <button type="button" role="radio" data-value="obsidian">Obsidian</button>
      </div>
    </div>
  </div>
  <button type="button" id="keys-button">Keyboard shortcuts<kbd>?</kbd></button>
</div>

<div id="mdpv-keys" popover aria-label="Keyboard shortcuts">
  <h2>Keyboard shortcuts</h2>
  <dl>
    <dt><kbd>j</kbd> <kbd>k</kbd></dt><dd>Scroll down / up</dd>
    <dt><kbd>d</kbd> <kbd>u</kbd></dt><dd>Half a page down / up</dd>
    <dt><kbd>gg</kbd> <kbd>G</kbd></dt><dd>Top / bottom</dd>
    <dt><kbd>]]</kbd> <kbd>[[</kbd></dt><dd>Next / previous heading</dd>
    <dt><kbd>o</kbd></dt><dd>Outline</dd>
    <dt><kbd>w</kbd></dt><dd>Full width</dd>
    <dt><kbd>t</kbd></dt><dd>Cycle theme</dd>
    <dt><kbd>s</kbd></dt><dd>Cycle style</dd>
    <dt data-live><kbd>f</kbd></dt><dd data-live>Follow cursor</dd>
    <dt><kbd>m</kbd></dt><dd>Menu</dd>
    <dt data-live>Double-click</dt><dd data-live>Jump to that line in Neovim</dd>
  </dl>
</div>
</body>
</html>
